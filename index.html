sor:pointer}.liked{color:#ff8200}.private{background:#fafafa;border-left:3px solid #ddd}.private .body{font-size:14px;color:#555}.pl{font-size:11px;color:#aaa;margin-bottom:8px}.foot{text-align:center;color:#aaa;font-size:11px;padding:18px}

<div class="cover" id="cover"></div><section class="profile"><div class="avatar" id="avatar">暗</div><div class="pTop"><div><div class="name" id="name"></div><div class="bio" id="bio"></div><div class="loc" id="loc"></div></div><button class="follow" id="follow">+ 关注</button></div><div class="stats"><div><b id="pc"></b><span>微博</span></div><div><b id="fg"></b><span>关注</span></div><div><b id="fr"></b><span>粉丝</span></div></div></section>
<div class="tabs" id="tabs"></div><div id="feed"></div><div class="foot">三条没有说出口的喜欢 · 写给昭昭</div></div>
<script>const D=[{"tab":"同桌","name":"1103","bio":"风从靠窗那一侧来。","city":"California","color":"#6F8FA6","stats":[73,41,118],"posts":[["09-03 08:12","iPhone","新学期换座位。她坐我右边，把书包塞进桌肚时撞到我的膝盖，说了句不好意思。其实一点都不疼。",12,1,0],["09-18 17:46","微博 weibo.com","她今天忘带尺子，借我的。下课后还回来，尺子上多了一道很浅的铅笔印。我没擦。",19,2,1],["PRIVATE","","她写字的时候习惯把左手压在本子边上，困了会拿笔尖轻轻戳自己的草稿纸。我已经知道她什么时候是真的听课，什么时候只是睁着眼发呆。最麻烦的是，我开始记得这些没用的事。",0,0,0],["10-11 12:21","iPhone","食堂排队，她站我前面。轮到最后一份糖醋排骨，她回头问我要不要。我说不要。其实我想要，但更想看她端走。",27,3,0],["11-03 21:07","iPhone","晚自习停电三分钟。她第一反应是小声叫我名字。灯亮以后她说，刚才什么都没发生。嗯，什么都没发生。",48,6,2],["12-24 16:35","微博 weibo.com","她给全组发了糖，我也有一颗。明明和别人一样，还是在口袋里放了一下午才舍得吃。",33,4,0],["02-14 18:02","iPhone","今天没什么特别的。只是她放学前问我周末作业写到哪了。我把这句话记到现在。",61,7,3],["PRIVATE","","我有时候会想，如果毕业以后再也见不到她，这一年是不是会变成一件很轻的事。可我又知道不会。她借过的尺子、吃过的糖、叫过我名字的那三分钟，都会留下来。",0,0,0],["03-26 14:18","iPhone","体育课她跑完八百米，趴在桌上不想动。我把窗开小了一点，怕风吹她。她不知道。",42,2,1],["04-19 10:43","微博 weibo.com","她今天剪了刘海。所有人都说变化不大，我也说没看出来。其实她一进门我就看见了。",55,5,2],["05-20 20:14","iPhone","她问我毕业照要不要站她旁边。我说随便。回家以后把明天穿什么翻了半个小时。",76,8,4],["06-09 23:11","iPhone","毕业了。她在校门口说以后也要联系。我终于没有说‘随便’。我说，好。",103,12,6]]},{"tab":"学长学妹","name":"1314","bio":"楼梯拐角总比钟声慢半拍。","city":"San Jose","color":"#9B806C","stats":[88,37,143],"posts":[["09-06 15:17","iPhone","社团招新，她站在桌前问报名表怎么填。其实那一栏旁边写得很清楚，我还是从头给她讲了一遍。",15,1,0],["09-29 18:40","微博 weibo.com","走廊碰到她，她叫我学长。两个字说得太自然，我却在电梯里想了三层楼。",24,2,1],["10-22 20:05","iPhone","她发消息问活动室钥匙在哪。我回得很快，又故意隔了两分钟才补一句‘找不到可以叫我’。",31,4,0],["PRIVATE","","她每次叫学长的时候，我都想让她换个只属于我的称呼。这个念头很幼稚，我知道。所以我从来没有说。",0,0,0],["11-17 13:26","iPhone","下雨。她没带伞。我把伞递过去，说我还有事。其实我在教学楼门口等雨小了四十分钟。",57,6,2],["12-31 23:53","微博 weibo.com","她群里发了新年快乐。我跟着所有人回了一句。想单独发的那句，删了。",64,7,3],["02-21 11:14","iPhone","她说最近很困。我给她买咖啡的时候顺手买了两杯，装成自己喝不完。",45,3,1],["03-14 17:55","iPhone","她今天问我有没有喜欢的人。我说有。她追问是谁。我说你猜。她笑着说不猜。",82,9,4],["PRIVATE","","我其实差一点就说出口了。那一秒我甚至想好了她拒绝以后我要怎么装得无所谓。可她一笑，我又舍不得让这个关系突然变得尴尬。",0,0,0],["04-28 19:10","微博 weibo.com","她把活动总结写错一个日期，跑来求我别扣分。我本来也没打算扣。还是装模作样看了半天。",53,5,1],["05-27 16:02","iPhone","她说毕业以后别把她忘了。我回，谁会忘你。说完才发现这句话有点太真。",91,11,5],["06-18 22:36","iPhone","毕业聚餐散场，她又叫了一声学长。我说以后别这么叫了。她愣了一下。我补了一句，叫名字吧。",127,16,7]]},{"tab":"隔壁班","name":"1122","bio":"隔着一面墙，天气也会不一样。","city":"Bay Area","color":"#71867B","stats":[69,52,97],"posts":[["09-10 09:31","iPhone","做操的时候发现隔壁班第二排左起第三个总扎马尾。后来才知道她叫昭昭。",10,0,0],["10-03 16:08","微博 weibo.com","今天借口去隔壁班找同学，进去两次。那个同学其实请假了。",22,2,0],["10-30 12:49","iPhone","食堂隔了三张桌子。她笑的时候会低头一下，再抬起来继续说。我隔着人群看了很久。",35,3,1],["PRIVATE","","最荒唐的是，我们甚至不熟。我只能从别人嘴里知道她喜欢吃什么、哪科比较好、今天为什么没来。喜欢一个几乎不认识的人，像拿着一张只有几个坐标的地图。",0,0,0],["11-22 18:11","iPhone","第一次真正说话。她来借球，问我‘你们班还有吗’。我说有，然后把我们班唯一一个篮球给她了。",49,5,2],["12-16 07:58","微博 weibo.com","早自习迟到，在楼梯口碰见她。我们一起被值周老师记名字。突然觉得被罚站也没那么倒霉。",58,6,3],["02-09 21:33","iPhone","开学第一天，她经过我们班门口时朝里面看了一眼。我知道不是在找我，还是抬头了。",44,4,1],["03-30 15:20","iPhone","运动会，她跑接力。我第一次在人群里喊她名字。她没听见。也好。",67,7,3],["PRIVATE","","我练习过很多次怎么和她说第一句真正属于我们的话。最后发现所有练习都没用。只要她站到我面前，我就会忘。",0,0,0],["04-15 17:42","微博 weibo.com","她今天主动和我打招呼。就一句‘嗨’。我回了句‘嗯’。回家以后后悔了一晚上，为什么只会说嗯。",84,10,4],["05-31 13:03","iPhone","拍毕业纪念册，她来我们班找朋友。我把自己的那页递给她，她写：以后见到我记得多说两个字。",111,14,6],["06-12 20:28","iPhone","毕业后第一次在聊天框里主动找她。我打了很多字，最后发出去的是：到家了吗？她回：到了。你呢？",139,18,8]]}];let cur=0;const $=s=>document.querySelector(s);function render(){const p=D[cur];$("#cover").style.background=p.color;$("#avatar").style.background=p.color;$("#name").textContent=p.name;$("#bio").textContent=p.bio;$("#loc").textContent="⌖ "+p.city;$("#pc").textContent=p.stats[0];$("#fg").textContent=p.stats[1];$("#fr").textContent=p.stats[2];$("#tabs").innerHTML=D.map((x,i)=>`<div class="tab ${i===cur?"on":""}" data-i="${i}">${x.tab}</div>`).join("");document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{cur=+x.dataset.i;render()});$("#feed").innerHTML=p.posts.map(x=>x[0]==="PRIVATE"?`<article class="card private"><div class="pl">▣ 仅自己可见</div><div class="body">${x[2]}</div></article>`:`<article class="card"><div class="ch"><div class="mini" style="background:${p.color}">暗</div><div class="meta"><b>${p.name}</b><div class="time">${x[0]} · 来自 ${x[1]}</div></div></div><div class="body"><span class="topic">#暗恋日记#</span>\n${x[2]}</div><div class="acts"><div class="act">↗ ${x[5]}</div><div class="act">◌ ${x[4]}</div><div class="act like" data-n="${x[3]}">♡ ${x[3]}</div></div></article>`).join("");document.querySelectorAll(".like").forEach(x=>x.onclick=()=>{let on=x.classList.toggle("liked"),n=+x.dataset.n;x.textContent=(on?"♥ ":"♡ ")+(n+(on?1:0))})}$("#follow").onclick=function(){this.textContent=this.textContent.includes("已关注")?"+ 关注":"✓ 已关注"};render();</script></body></html>
